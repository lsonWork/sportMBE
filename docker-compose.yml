version: '3.9'

services:
  # backend:
  #   build: .
  #   container_name: sport-backend
  #   restart: always
  #   ports:
  #     - "${API_PORT}:${API_PORT}"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - postgres
  #     - redis
  #   command: npm run start:dev

  postgres:
    image: postgres:16
    container_name: sport-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:${DATABASE_PORT}'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sport-redis
    restart: always
    ports:
      - '${REDIS_PORT}:6379'

volumes:
  postgres_data:
